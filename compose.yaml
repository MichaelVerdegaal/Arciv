# Single service: the Arciv web app. Mount the same data directory the CLI
# writes so the UI reads the same arciv.db and saved/ files.
#
# ARCIV_DATA_DIR defaults to ~/.local/share/arciv.
services:
  arciv:
    build: .
    ports:
      - "${ARCIV_PORT:-8000}:8000"
    volumes:
      - "${ARCIV_DATA_DIR:-~/.local/share/arciv}:/data"
    restart: unless-stopped
