services:
  clotho:
    build: .
    # Google Chrome only ships for x86_64 Linux; on ARM hosts (e.g. Apple
    # Silicon) this runs under emulation rather than failing the build.
    platform: linux/amd64
    init: true
    # Chrome needs more shared memory than Docker's 64MB default
    shm_size: 1gb
    environment:
      # Path inside the container; the bind mount below provides the notes
      CLOTHO_NOTES_PATH: /notes
    volumes:
      # Archive (SQLite DB, saved pages, logs) persists on the host
      - ./data:/app/data
      # Host notes directory from .env, mounted read-only
      - ${CLOTHO_NOTES_PATH:?set CLOTHO_NOTES_PATH in .env}:/notes:ro
