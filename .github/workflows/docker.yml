name: Docker

# Verifies the CLI image builds and runs. Path-filtered so docs-only
# changes don't trigger a multi-minute image build.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - pyproject.toml
      - uv.lock
      - config.py
      - "clotho/**"
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - pyproject.toml
      - uv.lock
      - config.py
      - "clotho/**"
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: clotho:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --help imports the full CLI chain (click → pipeline → patchright,
      # trafilatura, liteparse), so it catches packaging/venv breakage
      - name: Smoke test CLI
        run: docker run --rm clotho:ci --help

      - name: Verify Chrome is installed
        run: docker run --rm --entrypoint google-chrome clotho:ci --version
