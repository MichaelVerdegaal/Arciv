name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      # Ruff is static analysis — the dev group is enough, skip the heavy
      # runtime dependencies (patchright, trafilatura, liteparse)
      - run: uv sync --frozen --only-group dev
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every Python the project claims to support (requires-python) gets the
    # full suite, so a dependency losing wheel support breaks CI, not users
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run pytest

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    # The CLI must import and run on native Windows Python. This is a smoke
    # check (install + import + --help), not the full suite — a full Windows
    # test matrix is a follow-up if it proves worth the CI time.
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python -c "import arciv.scripts.cli"
      - run: uv run arciv --help
