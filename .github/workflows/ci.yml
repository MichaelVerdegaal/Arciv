name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Model-dependent tests (embedder, retrieval floor) self-skip when the
      # model is absent, so this runs offline and needs no HF token.
      - run: uv run pytest -x -q --tb=short
