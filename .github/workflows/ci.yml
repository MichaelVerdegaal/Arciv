name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      # Ruff is static analysis — the dev group is enough, skip the heavy
      # runtime dependencies (patchright, trafilatura, liteparse)
      - run: uv sync --frozen --only-group dev
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # mypy reads the types of the runtime deps it follows (typer, loguru,
    # platformdirs, plus numpy/huggingface_hub from the search extra), so it
    # needs the full sync with the extra, not the dev-only group the lint job
    # uses. The browser binary isn't needed for static analysis.
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --extra search
      - run: uv run --no-sync mypy

  # Core (no search extra): the suite minus tests/search (auto-skipped), on every
  # Python the project supports. This is what proves `arciv` works, and imports,
  # without chromadb/onnxruntime installed.
  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      # Coverage lives here, not in pyproject addopts, so a plain local
      # `pytest` (single-test runs, debuggers) isn't slowed by instrumentation
      - run: uv run pytest --cov=arciv --cov-report=term-missing

  # Full (with the search extra): the whole suite including tests/search. Pinned
  # to 3.12 because the ML wheels (onnxruntime, chromadb) lag the newest Python.
  test-full:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra search
      - run: uv run pytest --cov=arciv --cov-report=term-missing

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    # The CLI must import and run on native Windows Python. This is a smoke
    # check (install + import + --help), not the full suite — a full Windows
    # test matrix is a follow-up if it proves worth the CI time.
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python -c "import arciv.cli.cli"
      - run: uv run arciv --help
