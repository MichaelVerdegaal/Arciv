{% extends "base.html" %}
{% block title %}Arciv — Archive{% endblock %}
{% block main %}
<h1 class="mb-4 text-2xl font-bold">Archive</h1>

<form method="get" action="/" class="mb-4 flex flex-wrap items-end gap-2">
  <label class="form-control">
    <span class="label-text text-xs">Domain</span>
    <input name="domain" value="{{ domain }}" placeholder="example.com"
           class="input input-sm input-bordered" />
  </label>
  <label class="form-control">
    <span class="label-text text-xs">Status</span>
    <select name="status" class="select select-sm select-bordered">
      <option value="" {{ 'selected' if not status }}>any</option>
      <option value="done" {{ 'selected' if status == 'done' }}>done</option>
      <option value="pending" {{ 'selected' if status == 'pending' }}>pending</option>
      <option value="failed" {{ 'selected' if status == 'failed' }}>failed</option>
    </select>
  </label>
  <label class="form-control">
    <span class="label-text text-xs">Sort</span>
    <select name="sort" class="select select-sm select-bordered">
      <option value="fetched_at" {{ 'selected' if sort == 'fetched_at' }}>fetched</option>
      <option value="title" {{ 'selected' if sort == 'title' }}>title</option>
      <option value="word_count" {{ 'selected' if sort == 'word_count' }}>words</option>
    </select>
  </label>
  <label class="form-control">
    <span class="label-text text-xs">Order</span>
    <select name="order" class="select select-sm select-bordered">
      <option value="desc" {{ 'selected' if order == 'desc' }}>desc</option>
      <option value="asc" {{ 'selected' if order == 'asc' }}>asc</option>
    </select>
  </label>
  <button type="submit" class="btn btn-primary btn-sm">Apply</button>
</form>

{% include "partials/_page_table.html" %}
{% endblock %}
