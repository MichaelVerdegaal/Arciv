{% extends "base.html" %}
{% block title %}Arciv — Sources{% endblock %}
{% block main %}
<h1 class="mb-4 text-2xl font-bold">Sources</h1>
{% if not sources %}
<p class="opacity-60">No sources registered.</p>
{% else %}
<table class="table table-zebra table-sm">
  <thead><tr><th>Name</th><th>Path</th><th>Pages</th></tr></thead>
  <tbody>
    {% for source, count in sources %}
    <tr>
      <td>{{ source.name }}</td>
      <td class="opacity-70"><code>{{ source.path }}</code></td>
      <td class="opacity-70">{{ count }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endif %}
{% endblock %}
