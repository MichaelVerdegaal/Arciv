{% extends "base.html" %}
{% block title %}Arciv — Sources{% endblock %}
{% block main %}
<h1>Sources</h1>
{% if not sources %}
<p class="muted">No sources registered.</p>
{% else %}
<table class="striped">
  <thead><tr><th>Name</th><th>Path</th><th>Pages</th></tr></thead>
  <tbody>
    {% for source, count in sources %}
    <tr>
      <td>{{ source.name }}</td>
      <td class="muted"><code>{{ source.path }}</code></td>
      <td class="muted">{{ count }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endif %}
{% endblock %}
