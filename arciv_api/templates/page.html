{% extends "base.html" %}
{% set active = 'archive' %}
{% block title %}{{ page.title or page.url }} | Arciv{% endblock %}
{% block main %}
{% include "partials/_page_main.html" %}

{% if sources %}
<article class="border round">
  <h6>Referenced from</h6>
  <ul>
    {% for s in sources %}<li class="muted"><code>{{ s }}</code></li>{% endfor %}
  </ul>
</article>
{% endif %}
{% endblock %}
