{# Fragment form of the 404, patched into #page-main if a polled slug vanishes. #}
<div id="page-main">
  <h1 class="text-2xl font-bold">Not found</h1>
  <p class="opacity-70">No archived page has the slug <code>{{ slug }}</code>.</p>
  <p class="mt-2"><a class="link link-primary" href="/">← Back to archive</a></p>
</div>
