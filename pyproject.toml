[project]
name = "clotho"
version = "0.1.0"
description = "Your personal knowledge toolkit."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0", # Asynchronous file operations
    "loguru>=0.7.3", # Logging
    "playwright>=1.56.0", # Scraping and browser automation
    "trafilatura>=2.0.0", # HTML to markdown conversion
    "python-dotenv>=1.2.1", # Environment variable management
    "tldextract>=5.3.1", # Extracting domain information from URLs
    "hf-xet>=1.2.0", # Quicker huggingface downloads
    "torch==2.9.1", # PyTorch for machine learning
    "chonkie[hub,st]>=1.5.6", # Chunking
    "sentence-transformers>=5.2.3", # Sentence embeddings
    "brotli>=1.2.0", # Compression for HTML files
    "playwright-stealth>=2.0.2", # Stealth plugin for Playwright
    "real-ladybug>=0.15.1", # Graph DB
]

[dependency-groups]
dev = [
    "ruff>=0.14.5", # Linting / formatting
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clotho"]
