[project]
name = "clotho"
version = "0.1.0"
description = "Your personal knowledge toolkit."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0", # Asynchronous file operations
    "chonkie[hub,st]>=1.4.2", # Text chunking
    "hf-xet>=1.2.0", # Hugging Face faster downloads
    "loguru>=0.7.3", # Logging
    "playwright>=1.56.0", # Hugging Face models
    "trafilatura>=2.0.0", # HTML to markdown conversion
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "ruff>=0.14.5", # Linting / formatting
]


[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clotho"]
