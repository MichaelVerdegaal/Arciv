[project]
name = "clotho"
version = "0.1.0"
description = "Your personal knowledge toolkit."
readme = "README.md"
# Capped below 3.13: zstandard fails to build there (no usable wheel),
# breaking installs. Lift the cap once zstandard installs cleanly on 3.13.
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiofiles>=25.1.0", # Asynchronous file operations
    "click>=8.1.0", # CLI framework
    "python-dotenv>=1.2.1", # Environment variable management
    "loguru>=0.7.3", # Logging
    "tldextract>=5.3.1", # Extracting domain information from URLs
    "trafilatura>=2.0.0", # HTML to markdown conversion
    "patchright>=1.60.0", # Undetected Playwright fork for scraping
    "liteparse>=2.0.3",
    "platformdirs>=4.10.0", # OS-appropriate user data directory
]

[project.scripts]
clotho = "clotho.scripts.cli:cli"

[dependency-groups]
dev = [
    "ruff>=0.15.15",       # Linting / formatting
    "pytest>=8.3.0",       # Test runner
    "pytest-cov>=6.0.0",   # Coverage reporting
    "hypothesis>=6.120.0", # Property-based testing
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clotho"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=clotho --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["clotho"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
