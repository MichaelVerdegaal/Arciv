[project]
name = "clotho"
version = "0.1.0"
description = "Your personal knowledge graph with HelixDB and Obsidian notes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "chonkie[hub,st]>=1.4.2",
    "helix-py>=0.2.31",
    "hf-xet>=1.2.0",
    "loguru>=0.7.3",
    "playwright>=1.56.0",
    "trafilatura>=2.0.0",
    "yake>=0.6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.5",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clotho"]
