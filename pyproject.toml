[project]
name = "microrag"
version = "0.3.4"
description = "Local semantic search over markdown files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb==1.5.9",
    "onnxruntime==1.27.0",
    "tokenizers==0.23.1",
    "huggingface-hub==1.23.0",
    "numpy==2.5.1",
    "loguru>=0.7.3",
    "chonkie>=1.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[project.scripts]
microrag = "microrag.cli:main"

[tool.ruff.lint]
# ANN: type hints required. D: Google docstring style (presence is the
# author's call, so D1xx stays off). PTH: pathlib over os. PLC0415: no
# lazy imports inside functions. UP: builtin generics over typing.List.
extend-select = ["I", "B", "UP", "PTH", "ANN", "D", "PLC0415"]
ignore = ["D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# Typer's API is built on calling Option()/Argument() in parameter defaults;
# these are declarative markers, not mutable-default hazards.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D", "PLC0415"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["microrag"]
