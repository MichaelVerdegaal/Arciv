[project]
name = "clotho"
version = "0.1.0"
description = "Your personal knowledge graph with HelixDB and Obsidian notes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arrow>=1.4.0",
    "chonkie[hub,st]>=1.4.2",
    "helix-py>=0.2.31",
    "hf-xet>=1.2.0",
    "loguru>=0.7.3",
    "sentence-transformers>=5.1.2",
    "spacy>=3.8.9",
]

[dependency-groups]
dev = [
    "ruff>=0.14.5",
]
