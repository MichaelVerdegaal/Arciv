[project]
name = "clotho"
version = "0.1.0"
description = "Your personal knowledge toolkit."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0", # Asynchronous file operations
    "chonkie[hub,st]>=1.4.2", # Text chunking
    "hf-xet>=1.2.0", # Hugging Face faster downloads
    "loguru>=0.7.3", # Logging
    "playwright>=1.56.0", # Web scraping
    "turftopic[spacy, datamapplot]>=0.23.2", # Topic modeling
    "yake>=0.6.0", # Keyword extraction
    "torch>=2.9.1", # Pytorch, pin to specific version for CUDA
    "sentence-transformers>=5.2.0", # Hugging Face models
    "trafilatura>=2.0.0", # HTML to markdown conversion
    "python-dotenv>=1.2.1", # Environment variable management
    "jax>=0.9.0", # JAX for numerical computing (speeds up embedding models)
    "plotly>=6.5.2",
]

[dependency-groups]
dev = [
    "ruff>=0.14.5", # Linting / formatting
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126" },
]


[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clotho"]
