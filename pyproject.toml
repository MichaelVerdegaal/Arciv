[project]
name = "clotho"
version = "0.1.0"
description = "Your personal knowledge toolkit."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",          # Asynchronous file operations
    "loguru>=0.7.3",             # Logging
    "playwright>=1.56.0",        # Scraping and browser automation
    "trafilatura>=2.0.0",        # HTML to markdown conversion
    "python-dotenv>=1.2.1",      # Environment variable management
    "tldextract>=5.3.1",         # Extracting domain information from URLs
    "brotli>=1.2.0",             # Compression for HTML files
    "playwright-stealth>=2.0.2", # Stealth plugin for Playwright
]

[dependency-groups]
dev = [
    "ruff>=0.14.5", # Linting / formatting
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clotho"]
