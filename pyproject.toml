[project]
name = "clotho"
version = "0.1.0"
description = "Your personal knowledge graph with HelixDB and Obsidian notes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "arrow>=1.4.0",
    "beautifulsoup4>=4.14.3",
    "chonkie[hub,st]>=1.4.2",
    "helix-py>=0.2.31",
    "hf-xet>=1.2.0",
    "keybert>=0.9.0",
    "loguru>=0.7.3",
    "playwright>=1.56.0",
    "protobuf>=6.33.1",
    "sentence-transformers>=5.1.2",
    "torch>=2.9.1",
    "trafilatura>=2.0.0",
    "transformers==4.57.3",
    "yake>=0.6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.5",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clotho"]
