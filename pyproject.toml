[project]
name = "clotho"
version = "0.1.0"
description = "Your personal knowledge graph with HelixDB and Obsidian notes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "chonkie[hub,st]>=1.4.2",
    "hf-xet>=1.2.0",
    "loguru>=0.7.3",
    "playwright>=1.56.0",
    "turftopic[spacy]>=0.23.2",
    "yake>=0.6.0",
    "torch>=2.9.1",
    "sentence-transformers>=5.2.0",
    "trafilatura>=2.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.5",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126" },
]


[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clotho"]
