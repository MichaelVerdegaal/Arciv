[project]
name = "arciv"
version = "0.1.0"
description = "Your personal knowledge toolkit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",           # Asynchronous file operations
    "python-dotenv>=1.2.1",       # Environment variable management
    "loguru>=0.7.3",              # Logging
    "tldextract>=5.3.1",          # Extracting domain information from URLs
    "trafilatura>=2.0.0",         # HTML to markdown conversion
    "scrapling[fetchers]>=0.4.9", # Unified fetch layer (patchright + curl_cffi)
    "w3lib>=2.4.1",               # URL canonicalization (also a scrapling dep)
    "liteparse>=2.0.3",           # PDF parsing
    "platformdirs>=4.10.0",       # OS-appropriate user data directory
    "typer>=0.26.7",              # CLI framework
]

[project.optional-dependencies]
# Local semantic search (the `arciv search` sub-app). Kept out of the core
# install so a plain `arciv` stays light; `uv tool install "arciv[search]"`
# pulls these in. loguru/typer are already core, so they are not repeated.
# Bounds are lower floors (>=); uv.lock pins the exact versions.
search = [
    "chromadb>=1.5.9",       # Persistent vector store (cosine, one collection per root)
    "onnxruntime>=1.27.0",   # CPU inference for the embedding model
    "tokenizers>=0.23.1",    # Tokenizer for the ONNX model
    "huggingface-hub>=1.23.0", # One-time model download (the only networked path)
    "numpy>=2.5.1",          # Embedding arrays
    "chonkie>=1.7.0",        # Markdown-aware chunking
]

[project.scripts]
arciv = "arciv.cli.cli:cli"

[dependency-groups]
dev = [
    "ruff>=0.15.15", # Linting / formatting
    "pytest>=8.3.0", # Test runner
    "pytest-cov>=6.0.0", # Coverage reporting
    "hypothesis>=6.120.0", # Property-based testing (URL/slug/markdown invariants)
    "mypy>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arciv"]

[tool.mypy]
python_version = "3.12"
files = ["arciv"]
# Check inside functions that lack annotations too (e.g. the Click override),
# and flag ignore comments that no longer suppress anything.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Fetch/parse/URL libraries ship no type information; treat their imports as
# Any rather than erroring on the missing stubs. The search extra's chromadb,
# chonkie, onnxruntime, and tokenizers are the same (numpy and huggingface_hub
# ship their own types, so they are not listed — the typecheck job syncs the
# search extra so those resolve normally).
[[tool.mypy.overrides]]
module = [
    "aiofiles.*",
    "scrapling.*",
    "trafilatura.*",
    "liteparse.*",
    "tldextract.*",
    "chromadb.*",
    "chonkie.*",
    "onnxruntime.*",
    "tokenizers.*",
]
ignore_missing_imports = true

[tool.ruff.lint]
# Defaults (E4/E7/E9, F) plus import sorting (I), bugbear (B), and pyupgrade
# (UP). Line length is left to the formatter, so E501 stays off and long
# string literals in tests don't need noqa. These make the conventions
# AGENTS.md leans on (sorted imports, modern syntax) machine-enforced.
extend-select = ["I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No coverage flags here: a plain `pytest` (single-test debugging, IDE
# breakpoints) shouldn't pay for instrumentation. CI adds --cov itself.

[tool.coverage.run]
branch = true
source = ["arciv"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
